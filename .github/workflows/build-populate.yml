name: "Build and populate cache"
on:
  push:
    branches:
      - main
  schedule:
    - cron: 12 20 * * *
  workflow_dispatch:
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
permissions:
  contents: read
jobs:
  build-and-populate:
    strategy:
      matrix:
        nixpkgs:
          - github:NixOS/nixpkgs/nixpkgs-unstable
          - github:NixOS/nixpkgs/nixos-unstable
          - github:NixOS/nixpkgs/nixos-26.05
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: "francynox"
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build nix packages
        run: nix run github:Mic92/nix-fast-build -- --skip-cached --no-nom --flake .#ciJobs --override-input nixpkgs ${{ matrix.nixpkgs }}
      - name: Wait for cache upload
        run: sleep 10
