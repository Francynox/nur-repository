name: "Auto-Update Packages"
on:
  workflow_dispatch:
  schedule:
    - cron: 41 15 * * *
permissions:
  contents: read
jobs:
  list-all-packages:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: List all packages
        id: set-matrix
        run: |
          set -euo pipefail
          PACKAGES_JSON=$(nix flake show --json . | jq -c '[.packages | .[] | keys[]] | unique')
          echo "Found packages: $PACKAGES_JSON"
          echo "packages=$PACKAGES_JSON" >> "$GITHUB_OUTPUT"
  create-update-prs:
    needs: list-all-packages
    if: needs.list-all-packages.outputs.packages != '' && needs.list-all-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.list-all-packages.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Run update script for ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          SCRIPT_PATH=$(nix-build ./maintainers/scripts/update.nix \
            --argstr package "$PACKAGE" \
            --no-out-link)

          "$SCRIPT_PATH/bin/update-$PACKAGE"
      - name: Create Pull Request if changes detected
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          author: Pkgs updater Bot <actions@github.com>
          committer: Pkgs updater Bot <actions@github.com>
          commit-message: "auto-update: Update ${{ matrix.package }}"
          branch: "auto-update/${{ matrix.package }}"
          title: "Auto-update: ${{ matrix.package }}"
          body: |
            Automated update for \`${{ matrix.package }}\`.

            This PR was generated by the `auto-update-packages` GitHub Action.
          delete-branch: true
