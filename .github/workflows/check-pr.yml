name: "Check Pull Request"
on:
  pull_request:
    branches:
      - main
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
permissions:
  contents: read
jobs:
  check-packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nixpkgs:
          - github:NixOS/nixpkgs/nixpkgs-unstable
          - github:NixOS/nixpkgs/nixos-unstable
          - github:NixOS/nixpkgs/nixos-26.05
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Setup Cachix (Read-Only)
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: francynox
      - name: Build & Check all packages
        run: |
          nix run github:Mic92/nix-fast-build -- --skip-cached --no-nom --flake .#checks --override-input nixpkgs ${{ matrix.nixpkgs }}
  check-pr-success:
    name: "Check PR Success"
    runs-on: ubuntu-latest
    needs: [check-packages]
    if: always()
    steps:
      - name: Alls Green
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
